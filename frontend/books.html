<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIBUKU – Kelola Buku</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ═══════════════════════ NAVBAR  ═══════════════════════ -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-sibuku shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <i class="bi bi-book-half me-2"></i>SIBUKU
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active" href="books.html"><i class="bi bi-journals me-1"></i>Buku</a></li>
        <li class="nav-item"><a class="nav-link" href="members.html"><i class="bi bi-people-fill me-1"></i>Anggota</a></li>
        <li class="nav-item"><a class="nav-link" href="borrowings.html"><i class="bi bi-arrow-left-right me-1"></i>Peminjaman</a></li>
      </ul>
      <button class="btn btn-outline-light btn-sm ms-3" id="btn-reset" title="Reset Data">
        <i class="bi bi-arrow-counterclockwise me-1"></i>Reset Data
      </button>
    </div>
  </div>
</nav>

<!-- ═══════════════════════ TOAST ═══════════════════════ -->
<div id="toast-container"></div>

<!-- ═══════════════════════ MAIN ═══════════════════════ -->
<main class="container py-4">

  <div class="section-header mb-3">
    <h1 class="section-title"><i class="bi bi-journals me-2"></i>Daftar Buku</h1>
    <div class="d-flex gap-2 flex-wrap">
      <!-- Search -->
      <div class="search-wrapper">
        <span class="search-icon"><i class="bi bi-search"></i></span>
        <input type="text" id="search-book" class="form-control form-control-sm"
                placeholder="Cari judul / penulis / kategori…" style="min-width:200px;" />
      </div>
      <button class="btn btn-primary-custom btn-sm" id="btn-add-book">
        <i class="bi bi-plus-lg me-1"></i>Tambah Buku
      </button>
    </div>
  </div>

  <div class="table-wrapper">
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle mb-0">
        <thead>
          <tr>
            <th style="width:70px">ID</th>
            <th>Judul</th>
            <th>Penulis</th>
            <th>Kategori</th>
            <th>Tahun</th>
            <th>Stok</th>
            <th style="width:160px">Aksi</th>
          </tr>
        </thead>
        <tbody id="books-tbody">
          <tr><td colspan="7" class="text-center py-3 text-muted">Memuat…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<!-- ═══════════════════════ FOOTER ═══════════════════════ -->
<footer>
  <div class="container text-center">
    © 2026 SIBUKU – Sistem Peminjaman Buku Perpustakaan Kampus
  </div>
</footer>

<!-- ═══════════════════════ MODAL BOOK ═══════════════════════ -->
<div class="modal fade" id="bookModal" tabindex="-1" aria-labelledby="bookModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="bookModalLabel">Tambah Buku</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form id="book-form" novalidate>
          <input type="hidden" id="book-id-field" />

          <div class="mb-3">
            <label class="form-label fw-semibold">Judul <span class="text-danger">*</span></label>
            <input type="text" id="book-title" class="form-control" placeholder="Judul buku" maxlength="200" />
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Penulis <span class="text-danger">*</span></label>
            <input type="text" id="book-author" class="form-control" placeholder="Nama penulis" maxlength="200" />
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Kategori <span class="text-danger">*</span></label>
            <input type="text" id="book-category" class="form-control" placeholder="Informatika / Matematika / dll" list="category-list" />
            <datalist id="category-list">
              <option value="Informatika"></option>
              <option value="Jaringan"></option>
              <option value="Matematika"></option>
              <option value="Manajemen"></option>
              <option value="Sains"></option>
              <option value="Bahasa"></option>
            </datalist>
          </div>

          <div class="row g-2">
            <div class="col-6">
              <label class="form-label fw-semibold">Tahun <span class="text-danger">*</span></label>
              <input type="number" id="book-year" class="form-control" placeholder="2024" min="1900" max="2099" />
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold">Total Stok <span class="text-danger">*</span></label>
              <input type="number" id="book-total" class="form-control" placeholder="5" min="1" max="999" />
            </div>
          </div>
          <small class="text-muted">* Saat edit, stok tersedia akan disesuaikan secara proporsional.</small>

        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary-custom" id="btn-save-book">
          <i class="bi bi-save me-1"></i>Simpan
        </button>
      </div>

    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/books.js"></script>
</body>
</html>

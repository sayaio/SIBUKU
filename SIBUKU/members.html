<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ═══════════════════════ NAVBAR ═══════════════════════ -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-sibuku shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <i class="bi bi-book-half me-2"></i>SIBUKU
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="books.html"><i class="bi bi-journals me-1"></i>Buku</a></li>
        <li class="nav-item"><a class="nav-link active" href="members.html"><i class="bi bi-people-fill me-1"></i>Anggota</a></li>
        <li class="nav-item"><a class="nav-link" href="borrowings.html"><i class="bi bi-arrow-left-right me-1"></i>Peminjaman</a></li>
      </ul>
      <button class="btn btn-outline-light btn-sm ms-3" id="btn-reset" title="Reset Data">
        <i class="bi bi-arrow-counterclockwise me-1"></i>Reset Data
      </button>
    </div>
  </div>
</nav>

<!-- ═══════════════════════ TOAST ═══════════════════════ -->
<div id="toast-container"></div>

<!-- ═══════════════════════ MAIN ═══════════════════════ -->
<main class="container py-4">

  <div class="section-header mb-3">
    <h1 class="section-title"><i class="bi bi-people-fill me-2"></i>Daftar Anggota</h1>
    <button class="btn btn-primary-custom btn-sm" id="btn-add-member">
      <i class="bi bi-person-plus-fill me-1"></i>Tambah Anggota
    </button>
  </div>

  <div class="table-wrapper">
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle mb-0">
        <thead>
          <tr>
            <th style="width:70px">ID</th>
            <th>Nama</th>
            <th>NIM</th>
            <th>Program Studi</th>
            <th>Status</th>
            <th style="width:160px">Aksi</th>
          </tr>
        </thead>
        <tbody id="members-tbody">
          <tr><td colspan="6" class="text-center py-3 text-muted">Memuat…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<!-- ═══════════════════════ FOOTER ═══════════════════════ -->
<footer>
  <div class="container text-center">
    © 2026 SIBUKU – Sistem Peminjaman Buku Perpustakaan Kampus
  </div>
</footer>

<!-- ═══════════════════════ MODAL MEMBER ═══════════════════════ -->
<div class="modal fade" id="memberModal" tabindex="-1" aria-labelledby="memberModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="memberModalLabel">Tambah Anggota</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form id="member-form" novalidate>
          <input type="hidden" id="member-id-field" />

          <div class="mb-3">
            <label class="form-label fw-semibold">Nama Lengkap <span class="text-danger">*</span></label>
            <input type="text" id="member-name" class="form-control" placeholder="Nama anggota" maxlength="150" />
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">NIM <span class="text-danger">*</span></label>
            <input type="text" id="member-nim" class="form-control" placeholder="Nomor Induk Mahasiswa" maxlength="20" />
            <div class="form-text">NIM harus unik dan berupa angka.</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Program Studi <span class="text-danger">*</span></label>
            <input type="text" id="member-major" class="form-control" placeholder="Program studi" list="major-list" />
            <datalist id="major-list">
              <option value="Informatika"></option>
              <option value="Sistem Informasi"></option>
              <option value="Teknik Komputer"></option>
              <option value="Teknik Elektro"></option>
              <option value="Manajemen Informatika"></option>
            </datalist>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Status <span class="text-danger">*</span></label>
            <select id="member-status" class="form-select">
              <option value="Aktif">Aktif</option>
              <option value="Nonaktif">Nonaktif</option>
            </select>
          </div>

        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary-custom" id="btn-save-member">
          <i class="bi bi-save me-1"></i>Simpan
        </button>
      </div>

    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/members.js"></script>
</body>
</html>
